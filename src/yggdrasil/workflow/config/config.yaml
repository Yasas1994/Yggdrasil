# Yggdrasil default configuration.
# `yggdrasil init` copies this into your run directory; edit there.
# The runner overlays your edits on these defaults, so omitted keys keep these values.

outdir: results
threads: 16
samples: samples.tsv          # generated by `yggdrasil init`

databases:
  dir: databases              # root for tool databases (CheckV, vContact3, PHROG, iPHoP)

preprocess:
  min_length: 5000
  dedup: false                # exact-sequence dedup (global); keep OFF for ecological counts

qc:
  threads: 16                 # single-run CheckV (per_sample: false)
  per_sample: true            # one CheckV job per sample (scales with sample count)
  sample_threads: 4           # threads per per-sample CheckV job

cluster:
  ani: 95                     # species-level vOTU ANI (%)
  align_frac: 0.85            # minimum alignment fraction
  threads: 32

annotate:
  phrog: true
  pharokka: true              # Pharokka (prodigal-gv + PHROG + tRNA); false -> prodigal-gv + MMseqs2/PHROG
  threads: 16
  seqs_per_chunk: 2000        # split vOTU reps into chunks of N seqs, one Pharokka job each; 0 = single run
  chunk_threads: 8            # threads per Pharokka chunk job

taxonomy:
  threads: 16
  db_version: 230             # vContact3 DB version (from prepare_databases)

lifestyle:
  tool: phastyle              # ProkBERT PhaStyle (Singularity image)
  threads: 8
  seqs_per_chunk: 2000        # chunk reps for parallel PhaStyle/BACPHLIP jobs; 0 = single run

abundance:
  enabled: true
  mapper: minimap2-sr         # minimap2-sr | bwa-mem | bwa-mem2 | strobealign
  threads: 16

ecology:
  group_col: null             # samples.tsv column for differential abundance; null -> skip ANCOM-BC

report:
  enabled: true

# ---- opt-in heavy modules ----
phylo:
  enabled: false
  threads: 16
amg:
  enabled: false              # AMG detection: Pharokka-based curated AMG-class mapping (lightweight, DRAM-v-free). Optional phold structural re-annotation on top.
  phold: true                 # run phold on Pharokka hypotheticals? true requires GPU and ~16 GB DB; false -> Pharokka-only AMG calls (fast)
  db: phold                   # phold DB dir name under databases.dir (~16 GB); absolute path overrides
  gpu: true                   # --foldseek_gpu (NVIDIA GPU via --apptainer-args=--nv); false for CPU-only
  threads: 16
host:
  enabled: false
  db: iphop                   # DB directory name under databases.dir (full DB is large; -dbv iPHoP_db_for-test for a tiny test DB)
  threads: 16
  seqs_per_chunk: 2000        # chunk reps for parallel iPHoP jobs; 0 = single run
virclust:
  enabled: false              # protein-based hierarchical clustering of vOTUs (VirClust, Moraru 2023)
  threads: 16
  gene_code: 11
viridic:
  enabled: false              # ICTV-style intergenomic similarities + clustering (VIRIDIC, Moraru 2020)
  threads: 16
  species_threshold: 95       # intergenomic similarity (%) for species-level clusters
  genus_threshold: 70         # intergenomic similarity (%) for genus-level clusters
